name: infra-scan

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra
          quiet: true
          skip_check: ""

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3

  trivy-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - "public.ecr.aws/aws-containers/retail-store-sample-ui:1.2.4"
          - "public.ecr.aws/aws-containers/retail-store-sample-carts:1.2.4"
    steps:
      - name: Run Trivy on ${{ matrix.image }}
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
