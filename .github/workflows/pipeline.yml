name: infra-scan

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra
          quiet: true
          # Enforcement happens here, not just in infra/.checkovignore, since
          # this action does not reliably pick up .checkovignore from the
          # scanned directory. See infra/.checkovignore for the documented
          # justification behind each of these.
          skip_check: CKV_AWS_382,CKV_AWS_119,CKV_AWS_150,CKV_AWS_260,CKV_AWS_18,CKV2_AWS_62,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_76,CKV_AWS_136,CKV_AWS_327,CKV_AWS_118,CKV2_AWS_8,CKV_AWS_326,CKV_AWS_162,CKV_AWS_325,CKV_AWS_139,CKV_AWS_354

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Required so gitleaks-action can authenticate its account-type
          # check (personal vs. organization) against the GitHub API.
          # Without this, the check hits the anonymous rate limit and falls
          # back to warning about a missing license, even though personal
          # accounts do not require one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-images:
    runs-on: ubuntu-latest
    # Required for OIDC-based AWS authentication (no static access keys
    # stored as GitHub secrets).
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        repo:
          - retail-multitier/retail-store-sample-ui
          - retail-multitier/retail-store-sample-cart
          - retail-multitier/retail-store-sample-catalog
          - retail-multitier/retail-store-sample-checkout
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role ARN lives in a GitHub Actions secret, never in this
          # committed file. Set it once under Settings > Secrets and
          # variables > Actions > New repository secret, name
          # AWS_ROLE_ARN, value from `tofu output github_actions_ecr_role_arn`.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Scans the actual private ECR mirror this project deploys from
      # (see infra/ecr.tf, scripts/mirror-images.sh), not the
      # public.ecr.aws source images. Scanning the source registry would
      # have been functionally near-identical (same image digest at
      # mirror time) but confusing to anyone reading this pipeline
      # alongside the ECS task definitions, which reference this private
      # registry, not the public one.
      - name: Run Trivy on ${{ matrix.repo }}
        # v-prefixed tag required since the post-incident retag; see
        # docs/architecture.md and this project's supply-chain notes.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.ecr-login.outputs.registry }}/${{ matrix.repo }}:1.2.4"
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
