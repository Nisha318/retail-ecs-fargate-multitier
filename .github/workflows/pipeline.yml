name: infra-scan

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra
          quiet: true
          # Enforcement happens here, not just in infra/.checkovignore, since
          # this action does not reliably pick up .checkovignore from the
          # scanned directory. See infra/.checkovignore for the documented
          # justification behind each of these.
          skip_check: CKV_AWS_382,CKV_AWS_119,CKV_AWS_150,CKV_AWS_260,CKV_AWS_18,CKV2_AWS_62,CKV_AWS_144

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Required so gitleaks-action can authenticate its account-type
          # check (personal vs. organization) against the GitHub API.
          # Without this, the check hits the anonymous rate limit and falls
          # back to warning about a missing license, even though personal
          # accounts do not require one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - "public.ecr.aws/aws-containers/retail-store-sample-ui:1.2.4"
          - "public.ecr.aws/aws-containers/retail-store-sample-cart:1.2.4"
    steps:
      - name: Run Trivy on ${{ matrix.image }}
        # v-prefixed tag required since the post-incident retag; see
        # docs/architecture.md and this project's supply-chain notes.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
